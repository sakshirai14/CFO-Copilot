services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cfo_copilot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cfo_copilot}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-cfo_copilot_test}
      DB_OWNER_USER: ${DB_OWNER_USER:-cfo_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_RW_USER: ${DB_APP_RW_USER:-app_rw}
      DB_APP_RW_PASSWORD: ${DB_APP_RW_PASSWORD}
      DB_APP_RO_USER: ${DB_APP_RO_USER:-app_ro}
      DB_APP_RO_PASSWORD: ${DB_APP_RO_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - cfo_pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sh:/docker-entrypoint-initdb.d/01_init_db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cfo_copilot}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  cfo_pgdata:
    name: cfo_copilot_pgdata
