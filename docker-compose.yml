# Docker Compose Placeholder for CFO Copilot on a Budget
# Production / containerized deployment will be wired in Phase 2 / Phase 5.
#
# Services envisioned:
#   - db: PostgreSQL 16 with pgvector extension (or relational db + standalone vector store)
#   - inference: Local serving engine (e.g. llama.cpp server with Metal/CPU or vLLM on CUDA)
#   - api: FastAPI / Google ADK application server
#   - ui: Web frontend with streaming chat and "Show Your Work" panel
#
# Note for macOS hosts: Docker Desktop on macOS runs inside a Linux VM and does not
# have direct access to Apple Silicon Metal GPU acceleration. Native llama.cpp is
# recommended for local macOS development to utilize Apple M-series GPU/NE cores.

