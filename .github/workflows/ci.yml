name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-and-architecture-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest anyio pydantic pydantic-settings structlog starlette fastapi httpx

      - name: Run Unit and AST Architecture Tests
        run: |
          # Executes Foundation Lock 2 AST boundary checks and isolated domain unit tests
          # Does not require a live database, GPU, or model serving instance.
          pytest tests/unit/ -v
